plugins {
    id 'com.android.application' version '8.9.2'
}

android {
    namespace 'app.limitlesssight.poc'
    compileSdk 35
    defaultConfig {
        applicationId 'app.limitlesssight.poc'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0-bench'
    }
    androidResources {
        noCompress 'tflite'
    }
}

dependencies {
    implementation 'com.google.ai.edge.litert:litert:1.4.2'
}
